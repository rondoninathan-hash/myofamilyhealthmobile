<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sign In | Myo Family Health</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <header class="sub-header">
    <a href="javascript:history.back()" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/>
      </svg>
      Back
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-logo">
      <svg width="52" height="52" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18.5" stroke="#7BADA8" stroke-width="1.5"/>
        <path d="M20 10 L20 31" stroke="#7BADA8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M20 31 Q17 33 14 32" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 31 Q23 33 26 32" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 13 Q16 11 13 13" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 16 Q15 13.5 11 16" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 20 Q15 17.5 11 20" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 24 Q16 22 13 24" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 13 Q24 11 27 13" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 16 Q25 13.5 29 16" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 20 Q25 17.5 29 20" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 24 Q24 22 27 24" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 10 Q19 8 17.5 8" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M20 10 Q21 8 22.5 8" stroke="#7BADA8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="auth-logo-text">Myo Family Health</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="auth-tab" id="tab-create" onclick="switchTab('create')">Create Account</button>
    </div>

    <form id="form-signin" class="auth-form" onsubmit="handleSignIn(event)">
      <p id="signin-err" class="auth-err hidden"></p>
      <input class="form-input" type="email" id="si-email" placeholder="Email address" required autocomplete="email" />
      <input class="form-input" type="password" id="si-pw" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <form id="form-create" class="auth-form hidden" onsubmit="handleCreate(event)">
      <p id="create-err" class="auth-err hidden"></p>
      <input class="form-input" type="text" id="ca-name" placeholder="Full name" required autocomplete="name" />
      <input class="form-input" type="email" id="ca-email" placeholder="Email address" required autocomplete="email" />
      <input class="form-input" type="password" id="ca-pw" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="new-password" />
      <input class="form-input" type="password" id="ca-pw2" placeholder="Confirm password" required autocomplete="new-password" />
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    if (authSession()) {
      const p = new URLSearchParams(location.search).get('next');
      location.replace(p || 'index.html');
    }

    const params = new URLSearchParams(location.search);
    if (params.get('tab') === 'create') switchTab('create');

    function switchTab(t) {
      document.getElementById('tab-signin').classList.toggle('active', t === 'signin');
      document.getElementById('tab-create').classList.toggle('active', t === 'create');
      document.getElementById('form-signin').classList.toggle('hidden', t !== 'signin');
      document.getElementById('form-create').classList.toggle('hidden', t !== 'create');
    }

    function getRedirect() {
      return new URLSearchParams(location.search).get('next') || 'index.html';
    }

    function handleSignIn(e) {
      e.preventDefault();
      const r = authLogin(document.getElementById('si-email').value, document.getElementById('si-pw').value);
      if (r.ok) { location.replace(getRedirect()); }
      else { const el = document.getElementById('signin-err'); el.textContent = r.err; el.classList.remove('hidden'); }
    }

    function handleCreate(e) {
      e.preventDefault();
      const pw = document.getElementById('ca-pw').value;
      const pw2 = document.getElementById('ca-pw2').value;
      const el = document.getElementById('create-err');
      if (pw !== pw2) { el.textContent = 'Passwords do not match.'; el.classList.remove('hidden'); return; }
      const r = authRegister(document.getElementById('ca-name').value, document.getElementById('ca-email').value, pw);
      if (r.ok) { location.replace(getRedirect()); }
      else { el.textContent = r.err; el.classList.remove('hidden'); }
    }
  </script>
</body>
</html>
